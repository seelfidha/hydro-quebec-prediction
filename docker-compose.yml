services:
  postgres:
    image: postgres:17
    restart: always
    container_name: postgres_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root -d test_db" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - postgres
  mlflow:
    build:
      context: ./mlflows
    image: mlflow-recap:latest
    container_name: ml-flow
    ports:
      - "5000:5000"
    volumes:
      - ./database:/mlflow/database
      - ./mlruns:/mlflow/mlruns
      - .:/work
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: strongpassword
    depends_on:
      - mlflow
      - trainer
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  loader:
    container_name: data_loader
    build:
      context: .
      dockerfile: ./load/Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
  trainer:
    build:
      context: .
      dockerfile: ./train/Dockerfile
    container_name: data_trainer
    ports:
      - "8502:8502"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started
volumes:
  postgres_data:
  minio_data:
