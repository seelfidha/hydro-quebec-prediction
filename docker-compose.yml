services:
  app:
    container_name: data_loader
    build:
      context: ./load
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    depends_on:
      - postgres

  postgres:
    image: postgres:17
    restart: always
    container_name: postgres_db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: test_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/data.sql:/docker-entrypoint-initdb.d/02-data.sql
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - postgres
  mlflow:
    build:
      context: ./mlflow
    image: mlflow-recap:latest
    container_name: ml-flow
    ports:
      - "5000:5000"
    volumes:
      - ./database:/mlflow/database
      - ./mlruns:/mlflow/mlruns
      - .:/work

volumes:
  postgres_data:
